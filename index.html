<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Validator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    h1 {
      color: #f1f5f9;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 1.1rem;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #6366f1;
    }

    input::placeholder {
      letter-spacing: 1px;
      color: #475569;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #4f46e5;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #334155;
      cursor: not-allowed;
    }

    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    .result.valid {
      background: #052e16;
      border: 2px solid #16a34a;
    }

    .result.invalid {
      background: #2d0a0a;
      border: 2px solid #dc2626;
    }

    .result.error {
      background: #1c1917;
      border: 2px solid #d97706;
    }

    .result-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .result.valid .result-title { color: #4ade80; }
    .result.invalid .result-title { color: #f87171; }
    .result.error .result-title { color: #fbbf24; }

    .result-message {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .raw {
      margin-top: 12px;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #7dd3fc;
      word-break: break-all;
    }

    .loader {
      display: none;
      text-align: center;
      color: #64748b;
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Card Validator</h1>
    <p class="subtitle">Enter a card number to check if it passes Luhn validation</p>

    <div class="input-group">
      <input
        type="text"
        id="cardInput"
        placeholder="4111 1111 1111 1111"
        maxlength="24"
        autocomplete="off"
      />
    </div>

    <button id="validateBtn" onclick="validate()">Validate Card</button>

    <div class="loader" id="loader">Checking...</div>

    <div class="result" id="result">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-message" id="resultMessage"></div>
      <div class="raw" id="rawResponse"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('cardInput');

    // Format input as user types: groups of 4
    input.addEventListener('input', () => {
      let value = input.value.replace(/\D/g, '');
      value = value.match(/.{1,4}/g)?.join(' ') || value;
      input.value = value;
    });

    // Allow pressing Enter to validate
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') validate();
    });

    async function validate() {
      const cardNumber = input.value.trim();
      const btn = document.getElementById('validateBtn');
      const loader = document.getElementById('loader');
      const result = document.getElementById('result');

      if (!cardNumber) {
        showResult('error', '⚠️', 'No input', 'Please enter a card number.', '');
        return;
      }

      // Loading state
      btn.disabled = true;
      loader.style.display = 'block';
      result.style.display = 'none';

      try {
        const response = await fetch('https://card-validator-7bzt.onrender.com/card/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cardNumber }),
        });

        const data = await response.json();
        const raw = JSON.stringify(data, null, 2);

        if (response.status === 400) {
          showResult('error', '⚠️', 'Invalid Input', data.error, raw);
        } else if (data.valid === true) {
          showResult('valid', '✅', 'Valid Card Number', 'This card number passes Luhn validation.', raw);
        } else {
          showResult('invalid', '❌', 'Invalid Card Number', 'This card number fails Luhn validation.', raw);
        }

      } catch (err) {
        showResult('error', '⚠️', 'Connection Error', 'Could not reach the API. Make sure the server is running on port 3000.', '');
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }

    function showResult(type, icon, title, message, raw) {
      const result = document.getElementById('result');
      result.className = `result ${type}`;
      document.getElementById('resultIcon').textContent = icon;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultMessage').textContent = message;
      document.getElementById('rawResponse').textContent = raw ? `Response: ${raw}` : '';
      result.style.display = 'block';
    }
  </script>
</body>
</html>
